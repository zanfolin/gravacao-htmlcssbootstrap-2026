<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mensagens de Alerta</title>
    <link
      href="css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body style="background-color: #20c997">
    <div class="container pt-3">
      <div class="alert alert-primary" role="alert">
        Alerta
        <strong
          >Site do
          <a
            class="alert-link"
            href="https://getbootstrap.com/docs/5.3/components/alerts/"
            >Bootstrap</a
          ></strong
        >
      </div>
      <div class="alert alert-warning" role="alert">
        Alerta Abrir Site do
        <strong
          ><a class="alert-link" href="http://www.google.com.br"
            >Google</a
          ></strong
        >
      </div>
    </div>

    <div class="alert alert-danger m-2" role="alert">
      <h4 class="alert-heading">
        <symbol id="check-circle-fill" viewBox="0 0 16 16">
          <path
            d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z"
          /> </symbol
        >Contabilidade
      </h4>

      <p>2. O que é receita?</p>
      <hr />
      <p class="mb-0">
        É todo valor que uma empresa
        <strong>recebe pela venda de produtos ou serviços</strong>.
      </p>
    </div>

    <script
      src="js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
